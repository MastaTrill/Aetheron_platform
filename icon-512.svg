<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="60%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <linearGradient id="iconDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#627eea" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#iconBg)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.2" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#627eea" stroke-width="1.5" opacity="0.3" />

  <!-- Outer diamond -->
  <polygon points="256,90 376,256 256,422 136,256" fill="url(#iconDiamond)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#iconGlow)" />
  <!-- Inner diamond -->
  <polygon points="256,150 320,256 256,362 192,256" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.85" />
  <!-- Central cross-lines -->
  <line x1="136" y1="256" x2="376" y2="256" stroke="#00F0FF" stroke-width="2" opacity="0.7" />
  <line x1="256" y1="90" x2="256" y2="422" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />

  <!-- Energy nodes -->
  <circle cx="256" cy="90" r="7" fill="#00F0FF" />
  <circle cx="376" cy="256" r="7" fill="#00F0FF" />
  <circle cx="256" cy="422" r="7" fill="#00F0FF" />
  <circle cx="136" cy="256" r="7" fill="#00F0FF" />
</svg>

name: AETH V2 Migration Readiness

on:
  pull_request:
    paths:
      - "smart-contract/contracts/AetheronV2.sol"
      - "smart-contract/contracts/AetheronPermanentSupplyLock.sol"
      - "smart-contract/contracts/AetheronPresale.sol"
      - "smart-contract/deployments/aeth-v2-migration.json"
      - "smart-contract/deployments/presale-base.json"
      - "smart-contract/scripts/verify-aeth-v1-migration-snapshot.mjs"
      - "smart-contract/scripts/verify-aeth-v1-replacement-presale-recovery.mjs"
      - "smart-contract/scripts/lib/base-read-retry.mjs"
      - "smart-contract/test/AethV1MigrationSnapshotVerifier.test.js"
      - "smart-contract/test/AethV1ReplacementPresaleRecoveryReadiness.test.js"
      - "smart-contract/test/AetheronV2MigrationLedger.test.js"
      - "smart-contract/package.json"
      - "smart-contract/package-lock.json"
      - ".github/workflows/aeth-v2-migration-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "smart-contract/contracts/AetheronV2.sol"
      - "smart-contract/contracts/AetheronPermanentSupplyLock.sol"
      - "smart-contract/contracts/AetheronPresale.sol"
      - "smart-contract/deployments/aeth-v2-migration.json"
      - "smart-contract/deployments/presale-base.json"
      - "smart-contract/scripts/verify-aeth-v1-migration-snapshot.mjs"
      - "smart-contract/scripts/verify-aeth-v1-replacement-presale-recovery.mjs"
      - "smart-contract/scripts/lib/base-read-retry.mjs"
      - "smart-contract/test/AethV1MigrationSnapshotVerifier.test.js"
      - "smart-contract/test/AethV1ReplacementPresaleRecoveryReadiness.test.js"
      - "smart-contract/test/AetheronV2MigrationLedger.test.js"
      - "smart-contract/package.json"
      - "smart-contract/package-lock.json"
      - ".github/workflows/aeth-v2-migration-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v1-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: presale-dry-run
    defaults:
      run:
        working-directory: smart-contract
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
      SNAPSHOT_OUTPUT_PATH: ../aeth-v1-migration-snapshot.json
      AETH_V1_RECOVERY_OUTPUT_PATH: ../aeth-v1-replacement-presale-recovery.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-contract/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Verify migration snapshot policy test
        run: node --test test/AethV1MigrationSnapshotVerifier.test.js

      - name: Verify all prepared V1 migration balances on Base
        run: npm run verify:aeth-v1-migration-snapshot

      - name: Verify replacement-presale recovery policy test
        run: node --test test/AethV1ReplacementPresaleRecoveryReadiness.test.js

      - name: Verify V1 replacement-presale recovery readiness
        run: npm run verify:aeth-v1-replacement-recovery

      - name: Upload read-only migration snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeth-v1-migration-snapshot
          path: aeth-v1-migration-snapshot.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload read-only recovery readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeth-v1-replacement-presale-recovery
          path: aeth-v1-replacement-presale-recovery.json
          if-no-files-found: warn
          retention-days: 30

name: Dashboard Source Safety

on:
  pull_request:
    paths:
      - 'index.html'
      - 'index.js'
      - 'index-dom-overrides.js'
      - 'public-launch-gate.test.cjs'
      - 'presale-config.js'
      - 'presale-readiness.js'
      - 'vercel-analytics.entry.mjs'
      - 'dashboard.js'
      - 'dashboard-enhanced.js'
      - 'dashboard-enhanced.html'
      - 'dashboard.source-safety.test.mjs'
      - 'production-backend-base.test.mjs'
      - 'operational-script-base-safety.test.mjs'
      - 'update-wallets.js'
      - 'backend/**'
      - 'smart-contract/hardhat.config.js'
      - 'smart-contract/fund-wallets.mjs'
      - 'smart-contract/interact-mainnet.mjs'
      - 'smart-contract/utils/**'
      - 'smart-contract/scripts/deploy.mjs'
      - 'smart-contract/scripts/enable-trading.mjs'
      - 'smart-contract/scripts/verify-setup.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard-source-safety.yml'

permissions:
  contents: read

jobs:
  dashboard-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Verify patched proxy-addr resolution
        run: |
          node -e "const p=require('./node_modules/proxy-addr/package.json'); if(p.version !== '2.0.8') throw new Error('Unexpected proxy-addr version: '+p.version); console.log('Verified proxy-addr '+p.version)"

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run root safety and smoke tests
        run: npm test

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify patched backend dependency resolution
        run: |
          node -e "const path=require('path'); const root=path.resolve('backend/node_modules'); const proxy=require(path.join(root,'proxy-addr/package.json')); const mail=require(path.join(root,'nodemailer/package.json')); if(proxy.version !== '2.0.8' || mail.version !== '10.1.1') throw new Error('Unexpected backend dependency versions: '+proxy.version+', '+mail.version); console.log('Verified backend proxy-addr '+proxy.version+' and nodemailer '+mail.version)"

      - name: Audit backend production dependencies
        run: npm --prefix backend audit --omit=dev --audit-level=high

      - name: Validate isolated API entrypoint
        run: node --test backend/standalone-api.test.mjs

      - name: Run backend behavior tests
        run: npm --prefix backend test -- --runInBand

      - name: Run dashboard Jest suite
        run: npm run test:dashboard -- --runInBand

      - name: Build production bundle
        run: npm run build

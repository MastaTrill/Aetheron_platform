name: Aetheron Preview HTTP Acceptance

on:
  pull_request:
    paths:
      - 'scripts/verify-aetheron-preview.mjs'
      - '.github/workflows/aetheron-preview-acceptance.yml'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/standalone-api.mjs'
      - 'scripts/audit-production-dependencies.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit deployed backend production dependencies
        run: |
          cd backend
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
      - name: Verify isolated Render API over HTTPS without credentials
        run: node scripts/verify-aetheron-preview.mjs

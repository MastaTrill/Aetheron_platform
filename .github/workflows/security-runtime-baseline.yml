name: Security Runtime Baseline

on:
  push:
    branches:
      - fix/runtime-dependency-security-2026-09-02

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Aetheron node startup regression to pass
        working-directory: aetheron-node
        run: |
          npm ci
          npx jest __tests__/server-startup.test.js --runInBand
      - name: Reproduce executable legacy-network package entrypoints
        id: legacy
        continue-on-error: true
        run: node legacy-network-entrypoints.test.mjs
      - name: Require RED legacy-network regression
        run: |
          if [ "${{ steps.legacy.outcome }}" != "failure" ]; then
            echo "Expected legacy-network package regression to fail before cleanup."
            exit 1
          fi
          echo "RED confirmed: executable legacy-network package entrypoints remain."
      - name: Audit every npm workspace
        shell: bash
        run: |
          set -u
          workspaces=(. aetheron-node backend backend-api react-app dashboard-test-isolated smart-contract mobile-app)
          for dir in "${workspaces[@]}"; do
            echo "===== AUDIT $dir ====="
            (
              cd "$dir"
              npm install --package-lock-only --ignore-scripts --no-fund >/tmp/npm-lock.log 2>&1 || { cat /tmp/npm-lock.log; exit 1; }
              npm audit --json > /tmp/audit.json || true
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/audit.json","utf8")); const v=d.metadata?.vulnerabilities||{}; console.log(JSON.stringify({workspace:process.argv[1],total:v.total||0,critical:v.critical||0,high:v.high||0,moderate:v.moderate||0,low:v.low||0,info:v.info||0})); for (const [name,item] of Object.entries(d.vulnerabilities||{})) console.log(`ADVISORY ${name} severity=${item.severity} direct=${item.isDirect} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`);' "$dir"
            )
          done

name: Prepare audited dependency lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - audit/release-truth-2026-10-14
    paths:
      - '.github/workflows/prepare-audited-lockfile.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare lockfile-only security update
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Upload reviewed lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          retention-days: 7

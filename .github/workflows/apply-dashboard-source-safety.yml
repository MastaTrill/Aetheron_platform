name: Apply Dashboard Source Safety

on:
  push:
    branches:
      - 'fix/dashboard-source-dom-safety-82-84'
    paths:
      - 'scripts/apply-dashboard-source-safety.mjs'
      - '.github/workflows/apply-dashboard-source-safety.yml'

permissions:
  contents: write

jobs:
  apply-source-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-source-dom-safety-82-84
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic source patch
        run: node scripts/apply-dashboard-source-safety.mjs

      - name: Verify source invariant
        run: node dashboard.source-safety.test.mjs

      - name: Verify diff formatting
        run: git diff --check

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: move dashboard renderers to DOM APIs"
          git push origin HEAD:fix/dashboard-source-dom-safety-82-84

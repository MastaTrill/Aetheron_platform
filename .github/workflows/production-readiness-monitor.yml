name: Production Readiness Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check public pages and assets
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://aetrs.com/ \
            https://aetrs.com/presale.html \
            https://aetrs.com/presale-config.js \
            https://aetrs.com/presale.js \
            https://aetrs.com/presale-readiness.js \
            https://mastatrill.github.io/Aetheron_platform/ \
            https://mastatrill.github.io/Aetheron_platform/presale.html
          do
            curl --fail --silent --show-error --location --retry 3 --max-time 20 "$url" >/dev/null
          done

      - name: Enforce live homepage Base deployment truth
        shell: bash
        env:
          CANONICAL_AETH: 0xecf7e17fae148c01e1b5008a31dfd2d1b6608e4e
          LEGACY_AETH: 0xab5ae0d8f569d7c2b27574319b864a5ba6f9671e
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --max-time 20 \
            --header 'Cache-Control: no-cache' \
            --header 'Pragma: no-cache' \
            "https://aetrs.com/?readiness=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > /tmp/aetheron-home.html

          tr '[:upper:]' '[:lower:]' < /tmp/aetheron-home.html > /tmp/aetheron-home.lower.html

          grep -Fq "$CANONICAL_AETH" /tmp/aetheron-home.lower.html || {
            echo "Live homepage is missing the canonical Base AETH address."
            exit 1
          }
          grep -Fq 'base mainnet' /tmp/aetheron-home.lower.html || {
            echo "Live homepage is missing Base Mainnet labeling."
            exit 1
          }
          grep -Fq 'public purchase controls are disabled pending final authorization' /tmp/aetheron-home.lower.html || {
            echo "Live homepage is missing the launch-disabled safety notice."
            exit 1
          }

          for stale_marker in \
            "$LEGACY_AETH" \
            'polygon mainnet' \
            'chain id: 137' \
            'quickswap' \
            'buy aeth now'
          do
            if grep -Fq "$stale_marker" /tmp/aetheron-home.lower.html; then
              echo "Live homepage still exposes stale production marker: $stale_marker"
              exit 1
            fi
          done

      - name: Verify Base contract bytecode
        shell: bash
        env:
          BASE_RPC_URL: https://mainnet.base.org
          AETH_TOKEN: 0xecf7E17faE148C01E1b5008A31Dfd2d1B6608E4e
          PRESALE: 0xe0A3B6368312dFd3E7E76202e673f895f8235A3d
        run: |
          set -euo pipefail
          rpc() {
            curl --fail --silent --show-error --retry 3 --max-time 20 \
              -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getCode\",\"params\":[\"$1\",\"latest\"]}" \
              "$BASE_RPC_URL"
          }
          for address in "$AETH_TOKEN" "$PRESALE"; do
            response="$(rpc "$address")"
            echo "$response" | grep -Eq '"result":"0x[0-9a-fA-F]{4,}"' || {
              echo "Missing contract bytecode for $address"
              exit 1
            }
          done

      - name: Enforce published Base configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'chainId: 8453' presale-config.js
          grep -q 'status: "verify_on_chain"' presale-config.js
          grep -q 'presale-readiness.js' presale.html
          ! grep -q 'VERIFIED PRESALE LIVE' presale.html

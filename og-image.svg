<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Glowing accents -->
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <linearGradient id="etherPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627eea" />
      <stop offset="100%" stop-color="#4054b2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Orbital Ring Details -->
  <circle cx="960" cy="315" r="240" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.15" stroke-dasharray="8 6" />
  <circle cx="960" cy="315" r="170" fill="none" stroke="#627eea" stroke-width="1.5" opacity="0.25" />
  <circle cx="960" cy="315" r="90" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.2" />

  <!-- Right Hero Logo Emblem -->
  <g transform="translate(960, 315) scale(0.95)" filter="url(#glow)">
    <!-- Outer diamond -->
    <polygon points="0,-160 110,-10 0,160 -110,-10" fill="url(#etherPurple)" stroke="#00F0FF" stroke-width="3" opacity="0.9" />
    <!-- Inner faceted diamond -->
    <polygon points="0,-120 75,-10 0,120 -75,-10" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    <line x1="-110" y1="-10" x2="110" y2="-10" stroke="#00F0FF" stroke-width="2" opacity="0.8" />
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
    <!-- Energy Nodes -->
    <circle cx="0" cy="-160" r="7" fill="#00F0FF" filter="url(#badgeGlow)" />
    <circle cx="110" cy="-10" r="7" fill="#00F0FF" filter="url(#badgeGlow)" />
    <circle cx="0" cy="160" r="7" fill="#00F0FF" filter="url(#badgeGlow)" />
    <circle cx="-110" cy="-10" r="7" fill="#00F0FF" filter="url(#badgeGlow)" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    <!-- Small Brand Identifier Badge -->
    <rect width="210" height="34" rx="17" fill="rgba(0, 240, 255, 0.12)" stroke="#00F0FF" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#00F0FF" filter="url(#badgeGlow)" />
    <text x="32" y="22" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AETHERON ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      AETHERON <tspan fill="url(#primaryCyan)">$AETH</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="160" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Next-Generation Multichain DeFi, Staking &amp; Governance
    </text>

    <!-- Feature Pillars Cards -->
    <g transform="translate(0, 210)">
      <!-- Card 1: Staking -->
      <rect x="0" y="0" width="190" height="85" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" />
      <text x="18" y="32" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">MAX 50% APY</text>
      <text x="18" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Staking Pools</text>

      <!-- Card 2: Multichain -->
      <rect x="205" y="0" width="190" height="85" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="223" y="32" fill="#627eea" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">BASE &amp; POLYGON</text>
      <text x="223" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Multichain Ready</text>

      <!-- Card 3: Governance -->
      <rect x="410" y="0" width="190" height="85" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="428" y="32" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">ON-CHAIN</text>
      <text x="428" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">DAO Governance</text>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 360)">
      <text x="0" y="20" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
        Official Web App: <tspan fill="#00F0FF" font-weight="700">https://aetrs.com</tspan>
      </text>
    </g>
  </g>
</svg>
